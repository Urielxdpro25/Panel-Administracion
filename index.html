<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Loggin</title>
</head>

<body class="body">

    <!-- From Uiverse.io by andrew-demchenk0 -->

    <form class="form" id="formLogin">

        <div class="title">
            Bienvenido,<br>
            <span>Inicia sesión para entrar</span>
        </div>

        <input type="text" placeholder="Nombre" name="Nombre" class="input" id="name">

        <input type="password" placeholder="Contraseña" name="password" class="input" id="password">

        <div class="login-with">

            <button type="submit" class="button-confirm" id="btn" onclick="enviar">Ingresar → </button>

        </div>

    </form>

      <p class="p">© 2026 Panel de Admistracion. Todos los derechos reservados. La Doble U.</p>
    </footer>

   <script>

    let Usuario = "Uriel";
    let contraseña = "25507";

    const formulario = document.getElementById("formLogin");
    const name = document.getElementById("name");
    const password = document.getElementById("password");

    formulario.addEventListener("submit", (evento) => {

        evento.preventDefault();

        if (name.value === Usuario && password.value === contraseña) {

            localStorage.setItem("nombreUsuario", name.value);

            window.location.href = "Home.html";

        } else {

            alert("Usuario o contraseña incorrectos");

        }

    });

</script>
</body>

</html>
