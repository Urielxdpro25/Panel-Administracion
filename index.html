<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Loggin</title>
</head>

<body class="body">



    <!-- From Uiverse.io by StarMarketPros -->
    <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
                <input class="toggle" type="checkbox">
                <span class="slider"></span>
                <span class="card-side"></span>
                <div class="flip-card__inner">
                    <div class="flip-card__front">

                        <div class="title">Log in</div>
                        <form action="" class="flip-card__form">

                            <input type="email" placeholder="Email" name="email" class="flip-card__input">
                            <input type="password" placeholder="Password" name="password" class="flip-card__input">
                            <button class="flip-card__btn" onclick="location.href='Inicio.html'">
                                Ingresar
                            </button>
                        </form>

                    </div>
                    <div class="flip-card__back">
                        <div class="title">Sign up</div>
                        <form action="" class="flip-card__form">
                            <input type="text" placeholder="Nombre Negocio" name="Nombre Negocio" class="flip-card__input">
                            <input type="name" placeholder="Name" class="flip-card__input">
                            <input type="email" placeholder="Email" name="email" class="flip-card__input">
                            <input type="password" placeholder="Password" name="password" class="flip-card__input">
                            <button class="flip-card__btn">Confirmar</button>
                        </form>
                    </div>
                </div>
            </label>
        </div>
    </div>

</body>

</html>
