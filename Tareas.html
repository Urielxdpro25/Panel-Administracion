<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="LogoPDA.jpeg">

    <title>To do List</title>

    <style>
        
        .contenedor {
            width: auto;
            height: auto;
            background-color: darkkhaki;
            padding: 5px;
        }

        .agregar {
            background-color: aquamarine;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 15px;
            display: block;
            margin: 0 auto;
        }

        .listado {
            display: grid;
            grid-template-columns: repeat(3, 2fr);
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            width: 130px;
            height: auto;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
        }

        .borrar {
            background-color: lightcoral;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 12px;
        }

        .input {
            width: 120px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid black;
        }

        .terminadas {
            width: 130px;
            height: auto;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
        }
    </style>

</head>

<body class="body">

    <h1>To do List</h1>

    <nav class="navbar">

        <div class="direccion">
            <a href="Home.html">Inicio</a>
        </div>

        <div class="direccion">
            <a href="Graficos.html">Graficos</a>
        </div>

        <div class="direccion">
            <a href="Tareas.html" class="SideActive">Tareas</a>
        </div>

        <div class="direccion">
            <a href="Productos.html">Productos</a>
        </div>

    </nav>

    <div class="contenedor">

        <button class="agregar" id="agregar">
            Agregar Tarea
        </button>

        <div class="listado" id="listado"></div>

        <h2>Tareas terminadas</h2>
        <div class="listado" id="terminadas"></div>

    </div>

    

    <nav aria-label="Paginación de la página">

        <ul class="pagination">

            <li>
                <a href="Home.html">1</a>
            </li>

            <li>
                <a href="Graficos.html">2</a>
            </li>

            <li>
                <a href="Tareas.html" class="active">3</a>
            </li>

            <li>
                <a href="Productos.html">4</a>
            </li>

        </ul>

    </nav>

    
    <footer class="footer">

        <p class="p">
            © 2026 Panel de Administración. Todos los derechos reservados. La Doble U.
        </p>

    </footer>


    <script>
        const boton = document.getElementById("agregar");
        const lista = document.getElementById("listado");
        const terminadas = document.getElementById("terminadas");
        const contenedor = document.querySelector(".contenedor");
        let tareasTerminadas = [];

        boton.addEventListener("click", añadirTarea);

        function añadirTarea() {
            const card = document.createElement("div");
            const borrar = document.createElement("button");
            const input = document.createElement("input");
            const check = document.createElement("input");

            input.type = "text";
            input.placeholder = "Escribe tu tarea";
            input.classList.add("input");

            check.type = "checkbox";
            check.addEventListener("change", () => tareaTerminada(check));

            card.classList.add("card");
            borrar.classList.add("borrar");
            borrar.textContent = "Borrar";

            card.appendChild(input);
            card.appendChild(check);
            card.appendChild(borrar);
            lista.appendChild(card);
        }

        
        function tareaTerminada(check) {
    if (check.checked) {
        const card = check.parentElement;
        const input = card.querySelector(".input");

        tareasTerminadas.push(input.value);

        terminadas.appendChild(card);

        tareasTerminadas.forEach(function(tarea) {
            console.log(tarea);
        });
    }
}

      
        contenedor.addEventListener("click", borrarTarea);

        function borrarTarea(event) {
            if (event.target.classList.contains("borrar")) {
                const card = event.target.parentElement;
                card.remove();
            }
        }
    </script>

</body>

</html>
