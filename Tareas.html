    <style>
        .contenedor {
            width: auto;
            height: auto;
            background-color: darkkhaki;
            padding: 10px;
            border-radius: 10px;
        }

        .agregar {
            background-color: aquamarine;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 15px;
            display: block;
            margin: 0 auto;
        }

        .listado {
            display: grid;
            grid-template-columns: repeat(3, 2fr);
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            width: 130px;
            height: auto;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
        }

        .borrar {
            background-color: lightcoral;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 12px;
        }

        .input {
            width: 120px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid black;
        }

        .terminadas {
            width: 130px;
            height: auto;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
        }
    </style>

    <script>
        const boton = document.getElementById("agregar");
        const lista = document.getElementById("listado");
        const terminadas = document.getElementById("terminadas");
        const contenedor = document.querySelector(".contenedor");

        boton.onclick = () => {
            añadirTarea();
        };
        contenedor.addEventListener("click", manejarBorradoDeTarea);

        iniciarTareas();

        async function iniciarTareas() {
            try {
                const tareas = await window.BaseDeDatos.leerTareas();
                tareas.forEach((tarea) => añadirTarea(tarea));
            } catch (error) {
                console.error("Error al cargar las tareas:", error);
                alert("No se pudieron cargar las tareas guardadas.");
            }
        }

        function añadirTarea(tarea = {}) {
            if (typeof tarea === "string") {
                tarea = { texto: tarea, prioridad: "alta", completada: false };
            }

            const card = document.createElement("div");
            const borrar = document.createElement("button");
            const input = document.createElement("input");
            const check = document.createElement("input");
            const selection = document.createElement("select");
            const cargar = document.createElement("button");

            input.type = "text";
            input.placeholder = "Escribe tu tarea";
            input.classList.add("input");
            input.value = tarea.texto || "";

            check.type = "checkbox";
            check.checked = tarea.completada === true;
            check.addEventListener("change", async () => {
                (check.checked ? terminadas : lista).appendChild(card);

                if (card.dataset.taskId) {
                    await guardarTareaDeTarjeta(card);
                }
            });

            selection.classList.add("selection");

            const option1 = document.createElement("option");
            option1.value = "alta";
            option1.textContent = "Prioridad Alta";

            const option2 = document.createElement("option");
            option2.value = "media";
            option2.textContent = "Prioridad Media";

            const option3 = document.createElement("option");
            option3.value = "baja";
            option3.textContent = "Prioridad Baja";

            selection.append(option1, option2, option3);
            selection.value = tarea.prioridad || "alta";

            card.classList.add("card");
            if (tarea.id !== undefined) {
                card.dataset.taskId = tarea.id;
            }

            cargar.type = "button";
            cargar.classList.add("button-confirm");
            cargar.textContent = tarea.id === undefined ? "Cargar Tarea" : "Guardar cambios";
            cargar.addEventListener("click", () => guardarTareaDeTarjeta(card));

            borrar.classList.add("borrar");
            borrar.textContent = "Borrar";

            card.appendChild(input);
            card.appendChild(check);
            card.appendChild(selection);
            card.appendChild(cargar);
            card.appendChild(borrar);
            (check.checked ? terminadas : lista).appendChild(card);
            input.focus();
        }

        async function guardarTareaDeTarjeta(card) {
            const input = card.querySelector(".input");
            const check = card.querySelector('input[type="checkbox"]');
            const selection = card.querySelector(".selection");
            const botonGuardar = card.querySelector(".button-confirm");
            const texto = input.value.trim();

            if (!texto) {
                alert("Escribe una tarea antes de guardarla.");
                input.focus();
                return;
            }

            const tarea = {
                texto,
                prioridad: selection.value,
                completada: check.checked,
            };

            botonGuardar.disabled = true;
            try {
                if (card.dataset.taskId) {
                    tarea.id = Number(card.dataset.taskId);
                    await window.BaseDeDatos.actualizarTarea(tarea);
                } else {
                    const id = await window.BaseDeDatos.guardarTarea(tarea);
                    card.dataset.taskId = id;
                }

                botonGuardar.textContent = "Guardado";
            } catch (error) {
                console.error("Error al guardar la tarea:", error);
                alert("No se pudo guardar la tarea.");
            } finally {
                botonGuardar.disabled = false;
                botonGuardar.textContent = card.dataset.taskId
                    ? "Guardar cambios"
                    : "Cargar Tarea";
            }
        }

        async function manejarBorradoDeTarea(event) {
            if (event.target.classList.contains("borrar")) {
                const card = event.target.parentElement;
                const id = card.dataset.taskId;

                try {
                    if (id) {
                        await window.BaseDeDatos.borrarTarea(Number(id));
                    }
                    card.remove();
                } catch (error) {
                    console.error("Error al borrar la tarea:", error);
                    alert("No se pudo borrar la tarea.");
                }
            }
        }
    </script>
