<style>
    .catalogo-pagina {
        box-sizing: border-box;
        width: min(1200px, calc(100% - 32px));
        max-width: 1200px;
        margin: 0 auto 32px;
    }

    .catalogo-header {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 20px;
        padding: 24px;
        border-radius: 18px;
        background: linear-gradient(135deg, #0f5739, #23845c);
        color: #fff;
        box-shadow: 0 12px 28px rgba(15, 87, 57, 0.16);
    }

    .catalogo-header h1 {
        margin: 0 0 6px;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .catalogo-header p {
        margin: 0;
        color: rgba(255, 255, 255, 0.82);
    }

    #catalogo {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
        gap: 20px;
        align-items: stretch;
    }

    .productoCard {
        display: flex;
        min-width: 0;
        min-height: 380px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(15, 87, 57, 0.10);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(15, 87, 57, 0.12);
        transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .productoCard:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 34px rgba(15, 87, 57, 0.20);
    }

    .productoCard-imagen {
        width: 100%;
        height: 210px;
        object-fit: cover;
        background: #edf5ef;
    }

    .productoCard-sin-imagen {
        display: grid;
        place-items: center;
        color: #6b8175;
    }

    .productoCard-sin-imagen svg {
        width: 64px;
        height: 64px;
        opacity: 0.55;
    }

    .productoCard-cuerpo {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
    }

    .productoCard-nombre {
        margin: 0;
        color: #153b29;
        font-size: 1.2rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
    }

    .productoCard-descripcion {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: #5f6f66;
        line-height: 1.45;
        -webkit-box-orient: vertical;
    }

    .productoCard-precio {
        margin: auto 0 0;
        color: #0f5739;
        font-size: 1.35rem;
        font-weight: 800;
    }

    .productoCard-cantidad-label {
        color: #153b29;
        font-weight: 600;
    }

    .productoCard-cantidad {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b8c9bd;
        border-radius: 8px;
        font: inherit;
    }

    .productoCard-estado {
        min-height: 1.25em;
        margin: 0;
        color: #0f5739;
        font-size: 0.9rem;
    }

    .catalogo-vacio {
        grid-column: 1 / -1;
        padding: 48px 20px;
        border: 2px dashed rgba(15, 87, 57, 0.25);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.65);
        color: #4f6659;
        text-align: center;
    }

    @media (max-width: 780px) {
        .catalogo-pagina {
            width: min(100% - 24px, 1200px);
            margin: 0 auto 20px;
        }

        .catalogo-header {
            padding: 20px;
        }

        #catalogo {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: 14px;
        }
    }

    @media (max-width: 480px) {
        .catalogo-pagina {
            width: calc(100% - 16px);
            margin-inline: auto;
        }

        .catalogo-header {
            border-radius: 14px;
        }

        #catalogo {
            grid-template-columns: 1fr;
        }

        .productoCard {
            min-height: 0;
        }

        .productoCard-imagen {
            height: 230px;
        }
    }
</style>

    <main class="catalogo-pagina">
        <header class="catalogo-header">
            <h1>Catálogo de productos</h1>
            <p>Descubre todos los productos disponibles.</p>
        </header>

        <section id="catalogo" aria-live="polite" aria-label="Productos disponibles">
            <p class="catalogo-vacio">Cargando productos...</p>
        </section>
    </main>

    <footer class="footer">

    <script src="./utils/sidebar.js"></script>
    <script src="./BaseDeDatos.js"></script>
    <script>
        const contenedorCatalogo = document.getElementById("catalogo");
        const urlsDeImagen = [];

        const crearImagenPlaceholder = () => {
            const placeholder = document.createElement("div");
            placeholder.className = "productoCard-imagen productoCard-sin-imagen";
            placeholder.setAttribute("aria-label", "Producto sin imagen");
            placeholder.innerHTML =
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="m4 16 4.5-4.5 3.5 3.5 2.5-2.5 5.5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>';
            return placeholder;
        };

        const crearProductoCard = (producto) => {
            const card = document.createElement("article");
            card.className = "productoCard";

            if (producto.imagen instanceof Blob) {
                const url = URL.createObjectURL(producto.imagen);
                urlsDeImagen.push(url);

                const imagen = document.createElement("img");
                imagen.className = "productoCard-imagen";
                imagen.src = url;
                imagen.alt = producto.nombre || "Producto";
                imagen.loading = "lazy";
                card.appendChild(imagen);
            } else {
                card.appendChild(crearImagenPlaceholder());
            }

            const cuerpo = document.createElement("div");
            cuerpo.className = "productoCard-cuerpo";

            const nombre = document.createElement("h2");
            nombre.className = "productoCard-nombre";
            nombre.textContent = producto.nombre || "Producto sin nombre";

            const descripcion = document.createElement("p");
            descripcion.className = "productoCard-descripcion";
            descripcion.textContent = producto.descripcion || "Sin descripción";

            const precio = document.createElement("p");
            precio.className = "productoCard-precio";
            const valor = Number(producto.precio);
            precio.textContent = Number.isFinite(valor)
                ? new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS" }).format(valor)
                : `$${producto.precio || "0"}`;

            const cantidad = document.createElement("input");
            cantidad.className = "productoCard-cantidad";
            cantidad.type = "number";
            cantidad.min = "0";
            cantidad.step = "1";
            cantidad.required = true;
            cantidad.value = String(
                Number.isInteger(producto.cantidad) && producto.cantidad >= 0
                    ? producto.cantidad
                    : 0
            );
            cantidad.id = `cantidad-producto-${producto.id}`;

            const etiquetaCantidad = document.createElement("label");
            etiquetaCantidad.className = "productoCard-cantidad-label";
            etiquetaCantidad.htmlFor = cantidad.id;
            etiquetaCantidad.textContent = "Cantidad para los gráficos";

            const botonGuardarCantidad = document.createElement("button");
            botonGuardarCantidad.className = "btn-success";
            botonGuardarCantidad.type = "button";
            botonGuardarCantidad.textContent = "Guardar cantidad";

            const estadoCantidad = document.createElement("p");
            estadoCantidad.className = "productoCard-estado";
            estadoCantidad.setAttribute("role", "status");
            estadoCantidad.setAttribute("aria-live", "polite");

            cantidad.addEventListener("input", () => {
                cantidad.setCustomValidity("");
            });

            botonGuardarCantidad.addEventListener("click", async () => {
                const nuevaCantidad = cantidad.valueAsNumber;
                if (!Number.isInteger(nuevaCantidad) || nuevaCantidad < 0) {
                    cantidad.setCustomValidity("Ingresá una cantidad entera igual o mayor a cero.");
                    cantidad.reportValidity();
                    return;
                }

                botonGuardarCantidad.disabled = true;
                estadoCantidad.textContent = "Guardando...";
                try {
                    await window.BaseDeDatos.actualizarProducto({
                        ...producto,
                        cantidad: nuevaCantidad
                    });
                    producto.cantidad = nuevaCantidad;
                    estadoCantidad.textContent = "Cantidad guardada para los gráficos.";
                } catch (error) {
                    console.error("Error al guardar la cantidad del producto:", error);
                    estadoCantidad.textContent = "No se pudo guardar la cantidad.";
                } finally {
                    botonGuardarCantidad.disabled = false;
                }
            });

            cuerpo.append(
                nombre,
                descripcion,
                precio,
                etiquetaCantidad,
                cantidad,
                botonGuardarCantidad,
                estadoCantidad
            );
            card.appendChild(cuerpo);
            return card;
        };

        const cargarCatalogo = async () => {
            try {
                await window.BaseDeDatos.abrirBD();
                const productos = await window.BaseDeDatos.leerProductos();
                contenedorCatalogo.replaceChildren();

                if (!productos.length) {
                    const vacio = document.createElement("p");
                    vacio.className = "catalogo-vacio";
                    vacio.textContent = "Todavía no hay productos cargados.";
                    contenedorCatalogo.appendChild(vacio);
                    return;
                }

                productos.forEach((producto) => {
                    contenedorCatalogo.appendChild(crearProductoCard(producto));
                });
            } catch (error) {
                console.error("Error al cargar el catálogo:", error);
                const errorEstado = document.createElement("p");
                errorEstado.className = "catalogo-vacio";
                errorEstado.textContent = "No se pudieron cargar los productos.";
                contenedorCatalogo.replaceChildren(errorEstado);
            }
        };

        window.addEventListener("beforeunload", () => {
            urlsDeImagen.forEach((url) => URL.revokeObjectURL(url));
        });

        cargarCatalogo();
    </script>
