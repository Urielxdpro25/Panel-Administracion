<style>
    .formularios {
        background-color: aliceblue;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
    }

    .ImgProd{
        height: auto;
        width: 40%;
    }

    #fila {
        width: min(1200px, 100%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 1rem;
        background-color: transparent;
        padding: 1rem 0;
        height: auto;
    }

    #fila .card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 24px rgba(15, 87, 57, 0.12);
        background: #ffffff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        height: 100%;
    }

    #fila .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 32px rgba(15, 87, 57, 0.18);
    }

    #fila .card-img-top {
        height: 180px;
        object-fit: cover;
        width: 100%;
    }

    #fila .card-body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem;
    }

    #fila .card-title {
        margin: 0;
        color: #0f5739;
        font-weight: 700;
    }

    #fila .card-text {
        margin: 0;
        color: #404040;
    }

    #fila .btn-success {
        width: 100%;
        margin-top: auto;
        background-color: crimson;
    }

    #fila .btn-success :hover{
        background-color: red;
    }

    .CargarProd{
        background-color: darkcyan;
        }
        .CargarProd:hover{
            background-color: cadetblue;
        }

</style>
