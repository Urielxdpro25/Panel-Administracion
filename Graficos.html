<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Graficos</title>
</head>
<style>
    .grafico {
        background-color: aliceblue;
        gap: 20px;
        padding: 10px;
        display: grid;
        justify-content: space-around;
        
    }
</style>

<body class="body">
    <h1 class="h1">Graficos</h1>


    <nav class="navbar">

        <div class="direccion">
            <a href="Home.html">Inicio</a>
        </div>

        <div class="direccion">
            <a href="Graficos.html" class="SideActive">Graficos</a>
        </div>

        <div class="direccion">
            <a href="Tareas.html">Tareas</a>
        </div>

        <div class="direccion">
            <a href="Tareas.html">Productos</a>
        </div>
    </nav>




    <div class="dashboard">

        <div class="grafico">
            <h2>Productos - Puntos</h2>
            <canvas id="graficoPuntos"></canvas>
        </div>

        <div class="grafico">
            <h2>Productos - Barras</h2>
            <canvas id="graficoBarras"></canvas>
        </div>

        <div class="grafico">
            <h2>Productos - Distribución</h2>
            <canvas id="graficoTorta"></canvas>
        </div>

    </div>

    <nav aria-label="Paginación de la página">
        <ul class="pagination">
            <li><a href="Home.html">1</a></li>
            <li><a href="Graficos.html" class="active">2</a></li>
            <li><a href="Tareas.html">3</a></li>
            <li><a href="Productos.html">4</a></li>
        </ul>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        const productos = [
            { nombre: "Remera", cantidad: 25 },
            { nombre: "Pantalón", cantidad: 15 },
            { nombre: "Zapatillas", cantidad: 30 },
            { nombre: "Campera", cantidad: 10 },
            { nombre: "Gorra", cantidad: 20 }
        ];

        const nombres = productos.map(producto => producto.nombre);

        const cantidades = productos.map(producto => producto.cantidad);

        new Chart(document.getElementById("graficoBarras"), {
            type: "bar",

            data: {
                labels: nombres,

                datasets: [{
                    label: "Cantidad",
                    data: cantidades
                }]
            }
        });

        new Chart(document.getElementById("graficoTorta"), {
            type: "pie",

            data: {
                labels: nombres,

                datasets: [{
                    data: cantidades
                }]
            }
        });

        new Chart(document.getElementById("graficoPuntos"), {
            type: "scatter",

            data: {
                datasets: [{
                    label: "Cantidad de productos",

                    data: productos.map((producto, indice) => ({
                        x: indice + 1,
                        y: producto.cantidad
                    }))
                }]
            }
        });

    </script>

</body>

</html>
