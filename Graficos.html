    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        const productos = [
            { nombre: "Remera", cantidad: 25 },
            { nombre: "Pantalón", cantidad: 13 },
            { nombre: "Zapatillas", cantidad: 29 },
            { nombre: "Campera", cantidad: 10 },
            { nombre: "Gorra", cantidad: 20 }
        ];

        const nombres = productos.map(producto => producto.nombre);

        const cantidades = productos.map(producto => producto.cantidad);

        new Chart(document.getElementById("graficoBarras"), {
            type: "bar",

            data: {
                labels: nombres,

                datasets: [{
                    label: "Cantidad",
                    data: cantidades
                }]
            }
        });

        new Chart(document.getElementById("graficoTorta"), {
            type: "pie",

            data: {
                labels: nombres,

                datasets: [{
                    data: cantidades
                }]
            }
        });

        new Chart(document.getElementById("graficoPuntos"), {
            type: "scatter",

            data: {
                datasets: [{
                    label: "Cantidad de productos",

                    data: productos.map((producto, indice) => ({
                        x: indice + 1,
                        y: producto.cantidad
                    }))
                }]
            }
        });

    </script>
